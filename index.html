<!DOCTYPE html>
<html lang="uk" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЖУРНАЛ</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>

/* ══════════════════════════════════════
   НІЧНА ТЕМА  — темний термінал
══════════════════════════════════════ */
[data-theme="night"] {
  --bg:            #080a08;
  --surface:       #0f1210;
  --surface2:      #141814;
  --border:        #223022;
  --border-strong: #2e422e;
  --accent:        #3d6e32;
  --accent2:       #68b030;
  --text:          #c4d8ba;
  --text2:         #7a9870;
  --muted:         #445a40;
  --input-bg:      #090b09;
  --danger:        #c83030;
  --danger-bg:     #130606;
  --danger-border: #401818;
  --chip-bg:       #1e0808;
  --chip-border:   #4a1818;
  --chip-text:     #e09090;
  --total-bg:      #0a110a;
  --btn-color:     #ffffff;
  --sun-moon:      "🌙";
  --theme-label:   "NIGHT";
  --scanline: rgba(0,0,0,.08);
}

/* ══════════════════════════════════════
   ДЕННА ТЕМА  — максимальний контраст
══════════════════════════════════════ */
[data-theme="day"] {
  --bg:            #dde8d0;
  --surface:       #f0f5e8;
  --surface2:      #ffffff;
  --border:        #7aaa5a;
  --border-strong: #4a8a28;
  --accent:        #2d6018;
  --accent2:       #3a7a20;
  --text:          #0a1a06;
  --text2:         #2a4a18;
  --muted:         #4a6a38;
  --input-bg:      #ffffff;
  --danger:        #aa1010;
  --danger-bg:     #fde8e8;
  --danger-border: #cc5555;
  --chip-bg:       #fdd0d0;
  --chip-border:   #cc4444;
  --chip-text:     #880000;
  --total-bg:      #e0edd0;
  --btn-color:     #ffffff;
  --sun-moon:      "☀️";
  --theme-label:   "DAY";
  --scanline: rgba(255,255,255,0);
}

/* ══════════════════════════════════════
   БАЗОВІ СТИЛІ
══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { transition: background .3s, color .3s; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  padding: 16px 16px 40px;
  font-size: 14px;
  transition: background .3s, color .3s;
}

[data-theme="night"] body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    var(--scanline) 2px, var(--scanline) 4px
  );
  pointer-events: none;
  z-index: 999;
}

.container { max-width: 480px; margin: 0 auto; }

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
.header {
  border: 2px solid var(--border-strong);
  border-bottom: none;
  padding: 12px 16px 12px 20px;
  background: var(--surface2);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background .3s, border-color .3s;
}

[data-theme="night"] .header {
  background: linear-gradient(135deg, #141c14, #0a0d0a);
}

.header::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 5px; height: 100%;
  background: var(--accent2);
  transition: background .3s;
}

.header-left { padding-left: 8px; }

.header-title {
  font-family: 'Oswald', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent2);
  letter-spacing: 2px;
  transition: color .3s;
}

[data-theme="day"] .header-title {
  color: var(--accent);
}

/* ══════════════════════════════════════
   ПЕРЕМИКАЧ ДЕНЬ / НІЧ
══════════════════════════════════════ */
.theme-toggle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  user-select: none;
  flex-shrink: 0;
}

.toggle-track {
  width: 56px;
  height: 28px;
  border-radius: 14px;
  border: 2px solid var(--border-strong);
  background: var(--surface);
  position: relative;
  transition: background .3s, border-color .3s;
  cursor: pointer;
}

[data-theme="night"] .toggle-track {
  background: #1a2a1a;
  border-color: var(--accent);
}
[data-theme="day"] .toggle-track {
  background: #b8dfa0;
  border-color: var(--accent2);
}

.toggle-thumb {
  position: absolute;
  top: 3px; left: 3px;
  width: 18px; height: 18px;
  border-radius: 50%;
  transition: transform .25s cubic-bezier(.4,0,.2,1), background .3s;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  line-height: 1;
}

[data-theme="night"] .toggle-thumb {
  background: #334a33;
  transform: translateX(0);
}
[data-theme="day"] .toggle-thumb {
  background: var(--accent2);
  transform: translateX(28px);
}

.toggle-icons {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5px;
  pointer-events: none;
  font-size: 10px;
}

.toggle-label {
  font-family: 'Oswald', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  transition: color .3s;
}

[data-theme="day"] .toggle-label {
  color: var(--accent);
  font-weight: 600;
}

/* ══════════════════════════════════════
   CARDS
══════════════════════════════════════ */
.card {
  border: 2px solid var(--border);
  border-top: none;
  background: var(--surface);
  padding: 16px;
  transition: background .3s, border-color .3s;
}

[data-theme="day"] .card {
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.section-label {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  transition: color .3s, border-color .3s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.section-label::before {
  content: '';
  display: inline-block;
  width: 3px; height: 10px;
  background: var(--accent2);
  border-radius: 1px;
}

[data-theme="day"] .section-label::before {
  background: var(--accent);
}

/* ══════════════════════════════════════
   FIELDS
══════════════════════════════════════ */
.field-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.field-row:last-child { margin-bottom: 0; }

label {
  font-family: 'Oswald', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  letter-spacing: 1px;
  min-width: 80px;
  flex-shrink: 0;
  transition: color .3s;
}

[data-theme="day"] label { color: var(--text); }

input[type="number"],
input[type="date"],
select {
  flex: 1;
  background: var(--input-bg);
  border: 2px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 18px;
  font-weight: bold;
  padding: 9px 10px;
  outline: none;
  transition: border-color .15s, background .3s, color .3s;
  -webkit-appearance: none;
  appearance: none;
  text-align: right;
}

input[type="number"]::placeholder {
  color: var(--muted);
  opacity: 0.6;
  font-weight: normal;
}

[data-theme="day"] input[type="number"],
[data-theme="day"] input[type="date"],
[data-theme="day"] select {
  border-color: #8ab870;
  color: #0a1a06;
  font-weight: 600;
}

input:focus, select:focus {
  border-color: var(--accent2);
  outline: none;
}

[data-theme="day"] input:focus,
[data-theme="day"] select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(58,122,32,.15);
}

select { cursor: pointer; }
input[type="number"] { 
  text-align: right; 
  font-size: 18px; 
  font-weight: bold;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  opacity: 0.5;
}

[data-theme="night"] select option { background: #141814; }
[data-theme="day"]   select option { background: #ffffff; color: #0a1a06; }

input[type="date"]::-webkit-calendar-picker-indicator {
  cursor: pointer;
}
[data-theme="night"] input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(.7) sepia(1) saturate(2) hue-rotate(80deg);
}
[data-theme="day"] input[type="date"]::-webkit-calendar-picker-indicator {
  filter: none;
}

.skel {
  flex: 1;
  background: var(--input-bg);
  border: 2px solid var(--border);
  border-radius: 3px;
  padding: 9px 10px;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 1px;
  animation: pulse 1.2s ease-in-out infinite;
}

/* ══════════════════════════════════════
   AMMO ROWS
══════════════════════════════════════ */
.ammo-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  padding: 10px 12px;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-left: 4px solid var(--accent2);
  border-radius: 2px;
  transition: background .3s, border-color .3s;
}

[data-theme="day"] .ammo-row {
  border-left-color: var(--accent);
  background: #f8faf4;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}

.ammo-row:last-child { margin-bottom: 0; }

.ammo-name {
  font-family: 'Oswald', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent2);
  letter-spacing: 2px;
  transition: color .3s;
}

[data-theme="day"] .ammo-name { color: var(--accent); }

.ammo-unit {
  font-size: 10px;
  color: var(--muted);
  margin-left: 5px;
  transition: color .3s;
}

.ammo-ctrl { display: flex; align-items: center; gap: 6px; }
.ammo-ctrl input { width: 90px; flex: none; }

.btn-pm {
  background: var(--surface);
  border: 2px solid var(--border-strong);
  color: var(--text2);
  width: 40px; height: 40px;
  font-size: 22px;
  cursor: pointer;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Share Tech Mono', monospace;
  transition: all .1s;
  font-weight: bold;
  line-height: 1;
}

[data-theme="day"] .btn-pm {
  background: #e8f5da;
  border-color: var(--border-strong);
  color: var(--accent);
}

.btn-pm:active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  transform: scale(.93);
}

/* ══════════════════════════════════════
   TOTAL ROWS (окремі)
══════════════════════════════════════ */
.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--total-bg);
  border: 2px solid var(--accent2);
  border-radius: 2px;
  margin-top: 8px;
  transition: background .3s, border-color .3s;
}

[data-theme="day"] .total-row {
  background: #d4edbe;
  border-color: var(--accent);
}

.total-lbl {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 3px;
  transition: color .3s;
}

.total-val {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--accent2);
  transition: color .3s;
}

[data-theme="day"] .total-val { color: var(--accent); }

/* Спеціальний стиль для великого тоталу */
.total-row-large .total-val {
  font-size: 24px;
}

.total-row-large {
  margin-bottom: 12px;
}

.separator {
  border-top: 2px dashed var(--border);
  margin: 12px 0 0 0;
  opacity: 0.5;
}

/* ══════════════════════════════════════
   SUBMIT BUTTON
══════════════════════════════════════ */
.btn-submit {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  border: 2px solid var(--accent2);
  color: #fff;
  font-family: 'Oswald', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .15s;
  display: block;
  border-radius: 0;
}

[data-theme="day"] .btn-submit {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-size: 18px;
  box-shadow: 0 3px 8px rgba(45,96,24,.3);
}

.btn-submit:hover  { background: #4a8a28; }
.btn-submit:active { background: #2d5a18; transform: translateY(1px); }
.btn-submit:disabled {
  background: var(--muted);
  color: rgba(255,255,255,.5);
  cursor: not-allowed;
  border-color: var(--muted);
  box-shadow: none;
}

/* ══════════════════════════════════════
   SEND STATUS
══════════════════════════════════════ */
.send-status {
  padding: 11px 14px;
  font-size: 13px;
  text-align: center;
  display: none;
  border: 2px solid;
  border-top: none;
  letter-spacing: 1px;
  font-weight: 600;
}

.send-status.ok {
  display: block;
  color: var(--accent2);
  border-color: var(--accent);
  background: var(--total-bg);
}
[data-theme="day"] .send-status.ok {
  color: var(--accent);
  background: #e0f0d0;
}

.send-status.err {
  display: block;
  color: var(--danger);
  border-color: var(--danger);
  background: var(--danger-bg);
}
[data-theme="day"] .send-status.err {
  background: #feeaea;
}

.send-status.loading {
  display: block;
  color: #c09010;
  border-color: #c09010;
  background: var(--surface);
}

/* ══════════════════════════════════════
   MISSING BLOCK
══════════════════════════════════════ */
.missing-card {
  border: 2px solid var(--danger);
  border-top: none;
  background: var(--danger-bg);
  padding: 16px;
  transition: background .3s, border-color .3s;
}

[data-theme="day"] .missing-card {
  background: #fff0f0;
  border-color: #cc3333;
}

.missing-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--danger-border);
}

[data-theme="day"] .missing-head {
  border-bottom-color: #ddaaaa;
}

.missing-title {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  color: var(--danger);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
}

[data-theme="day"] .missing-title { color: #aa1010; }

.btn-refresh {
  background: transparent;
  border: 2px solid var(--danger-border);
  color: var(--muted);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 3px;
  transition: all .15s;
  letter-spacing: 1px;
  font-weight: 600;
}
.btn-refresh:hover {
  border-color: var(--danger);
  color: var(--danger);
}
[data-theme="day"] .btn-refresh:hover { color: #aa1010; border-color: #cc3333; }
.btn-refresh:disabled { opacity: .4; cursor: not-allowed; }

.missing-grid { display: flex; flex-wrap: wrap; gap: 6px; }

.missing-chip {
  font-family: 'Oswald', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--chip-text);
  padding: 6px 12px;
  background: var(--chip-bg);
  border: 2px solid var(--chip-border);
  border-radius: 3px;
  letter-spacing: 1px;
  transition: background .3s;
}

[data-theme="day"] .missing-chip {
  background: #ffd0d0;
  border-color: #cc4444;
  color: #880000;
}

.msg {
  padding: 10px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 1px;
  font-weight: 600;
}
.msg.ok    { color: var(--accent2); }
[data-theme="day"] .msg.ok { color: var(--accent); }
.msg.muted { color: var(--muted); }
.msg.warn  { color: #c09010; animation: pulse 1.2s ease-in-out infinite; }

/* ══════════════════════════════════════
   SYS LINE
══════════════════════════════════════ */
.sys-line {
  font-size: 11px;
  color: var(--muted);
  padding: 7px 16px;
  border: 2px solid var(--border);
  border-top: none;
  background: var(--bg);
  display: flex;
  justify-content: space-between;
  transition: background .3s, border-color .3s, color .3s;
}

[data-theme="day"] .sys-line {
  background: #d4deca;
  color: var(--text2);
}

/* ══════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════ */
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.cursor {
  display: inline-block;
  width: 9px; height: 16px;
  background: var(--accent2);
  margin-left: 3px;
  animation: blink 1s step-end infinite;
  vertical-align: middle;
  transition: background .3s;
}
[data-theme="day"] .cursor { background: var(--accent); }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-left">
      <div class="header-title">ЖУРНАЛ <span class="cursor"></span></div>
    </div>

    <div class="theme-toggle" onclick="toggleTheme()" title="Перемикач день/ніч">
      <div class="toggle-track">
        <div class="toggle-icons">
          <span>🌙</span>
          <span>☀️</span>
        </div>
        <div class="toggle-thumb"></div>
      </div>
      <div class="toggle-label" id="themeLabel">NIGHT</div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Реквізити</div>
    <div class="field-row">
      <label>ДАТА</label>
      <input type="date" id="date" />
    </div>
    <div class="field-row">
      <label>ЕКІПАЖ</label>
      <div id="crewWrap" style="flex:1">
        <div class="skel">⏳ завантаження...</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Використано набоїв</div>

    <!-- Група великого калібру -->
    <div class="ammo-row">
      <div><span class="ammo-name">МДЗ</span><span class="ammo-unit">шт</span></div>
      <div class="ammo-ctrl">
        <button class="btn-pm" onclick="dec('mdz')">−</button>
        <input type="number" id="mdz" value="" placeholder="0" min="0" step="1">
        <button class="btn-pm" onclick="inc('mdz')">+</button>
      </div>
    </div>
    <div class="ammo-row">
      <div><span class="ammo-name">БЗТ</span><span class="ammo-unit">шт</span></div>
      <div class="ammo-ctrl">
        <button class="btn-pm" onclick="dec('bzt')">−</button>
        <input type="number" id="bzt" value="" placeholder="0" min="0" step="1">
        <button class="btn-pm" onclick="inc('bzt')">+</button>
      </div>
    </div>
    <div class="ammo-row">
      <div><span class="ammo-name">Б32</span><span class="ammo-unit">шт</span></div>
      <div class="ammo-ctrl">
        <button class="btn-pm" onclick="dec('b32')">−</button>
        <input type="number" id="b32" value="" placeholder="0" min="0" step="1">
        <button class="btn-pm" onclick="inc('b32')">+</button>
      </div>
    </div>

    <!-- ВСЬОГО для великого калібру -->
    <div class="total-row total-row-large" style="border-color: var(--accent2);">
      <span class="total-lbl">ВСЬОГО (14.5мм)</span>
      <span class="total-val" id="totalLarge">0</span>
    </div>

    <div class="separator"></div>

    <!-- Група малого калібру -->
    <div class="ammo-row" style="margin-top: 12px;">
      <div><span class="ammo-name">ПС</span><span class="ammo-unit">шт</span></div>
      <div class="ammo-ctrl">
        <button class="btn-pm" onclick="dec('ps')">−</button>
        <input type="number" id="ps" value="" placeholder="0" min="0" step="1">
        <button class="btn-pm" onclick="inc('ps')">+</button>
      </div>
    </div>
    <div class="ammo-row">
      <div><span class="ammo-name">ТЗ</span><span class="ammo-unit">шт</span></div>
      <div class="ammo-ctrl">
        <button class="btn-pm" onclick="dec('tz')">−</button>
        <input type="number" id="tz" value="" placeholder="0" min="0" step="1">
        <button class="btn-pm" onclick="inc('tz')">+</button>
      </div>
    </div>

    <!-- ВСЬОГО для малого калібру -->
    <div class="total-row">
      <span class="total-lbl">ВСЬОГО (5.45мм)</span>
      <span class="total-val" id="totalSmall">0</span>
    </div>
  </div>

  <button class="btn-submit" id="btnSend" onclick="sendData()" disabled>
    ▶ ВІДПРАВИТИ В ТАБЛИЦЮ
  </button>
  <div class="send-status" id="sendStatus"></div>

  <div class="missing-card">
    <div class="missing-head">
      <span class="missing-title">⚠ Не надали відомості</span>
      <button class="btn-refresh" id="btnRefresh" onclick="loadData()">↻ ОНОВИТИ</button>
    </div>
    <div id="missingList">
      <div class="msg warn">⏳ завантаження...</div>
    </div>
  </div>

  <div class="sys-line">
    <span id="clock">—</span>
    <span>v4.1 · БАНКІР</span>
  </div>

</div>
<script>
// ═══════════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwoIRezYwaFnYER3JtaVLiU1dHJ9e3qEMdS495mRxXj2dg660Cp1BzJW0xIMPgDnBQp/exec';
// ═══════════════════════════════════════════════════════

const AMMO_LARGE = ['mdz', 'bzt', 'b32'];  // великий калібр (14.5мм)
const AMMO_SMALL = ['ps', 'tz'];           // малий калібр (5.45мм)
const AMMO_ALL = [...AMMO_LARGE, ...AMMO_SMALL];
const API_KEY = 'BK2026';
const STORAGE_CREW_KEY = 'bk_selected_crew';
let currentCrewList = [];

// ── Тема день/ніч ─────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isNight = html.getAttribute('data-theme') === 'night';
  const next = isNight ? 'day' : 'night';
  html.setAttribute('data-theme', next);
  document.getElementById('themeLabel').textContent = next === 'day' ? 'DAY' : 'NIGHT';
  try { localStorage.setItem('bk_theme', next); } catch(e){}
}

(function(){
  try {
    const saved = localStorage.getItem('bk_theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      const lbl = document.getElementById('themeLabel');
      if (lbl) lbl.textContent = saved === 'day' ? 'DAY' : 'NIGHT';
    }
  } catch(e){}
})();

// ── Дата ──────────────────────────────────────────────
function todayISO() { return new Date().toISOString().split('T')[0]; }
function todayUa() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`;
}
function isoToUa(v) {
  if (!v) return '';
  const [y,m,d] = v.split('-');
  return `${d}.${m}.${y}`;
}

// ── Функції для полів ─────────────────────────────────
function getInputValue(id) {
  const el = document.getElementById(id);
  const val = el.value;
  if (val === '') return 0;
  return parseInt(val) || 0;
}

function inc(id) {
  const e = document.getElementById(id);
  let val = getInputValue(id);
  e.value = val + 1;
  recalc();
}

function dec(id) {
  const e = document.getElementById(id);
  let val = getInputValue(id);
  const newVal = val - 1;
  e.value = newVal < 0 ? 0 : newVal;
  if (newVal < 0) e.value = '';
  recalc();
}

function recalc() {
  // Розрахунок для великого калібру (14.5мм)
  let totalLarge = 0;
  AMMO_LARGE.forEach(id => {
    totalLarge += getInputValue(id);
  });
  document.getElementById('totalLarge').textContent = totalLarge;
  
  // Розрахунок для малого калібру (5.45мм)
  let totalSmall = 0;
  AMMO_SMALL.forEach(id => {
    totalSmall += getInputValue(id);
  });
  document.getElementById('totalSmall').textContent = totalSmall;
}

function setupAutoClearOnFocus() {
  AMMO_ALL.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    
    el.addEventListener('focus', function() {
      if (this.value === '0' || this.value === '') {
        this.value = '';
      }
    });
    
    el.addEventListener('blur', function() {
      if (this.value === '' || this.value === null) {
        this.value = '';
      } else {
        let num = parseInt(this.value);
        if (isNaN(num) || num < 0) num = 0;
        if (num === 0) {
          this.value = '';
        } else {
          this.value = num;
        }
      }
      recalc();
    });
    
    el.addEventListener('input', function() {
      recalc();
    });
  });
}

// ── Збереження/відновлення екіпажу ───────────────────
function saveSelectedCrew(crewValue) {
  if (crewValue) {
    try {
      localStorage.setItem(STORAGE_CREW_KEY, crewValue);
    } catch(e) {}
  }
}

function getSavedCrew() {
  try {
    return localStorage.getItem(STORAGE_CREW_KEY);
  } catch(e) {
    return null;
  }
}

// ── Select екіпажів ───────────────────────────────────
function renderCrewSelect(crews) {
  const wrap = document.getElementById('crewWrap');
  if (!crews || crews.length === 0) {
    wrap.innerHTML = '<div class="skel" style="color:var(--danger)">⚠ список порожній</div>';
    return;
  }
  
  currentCrewList = crews;
  
  const sel = document.createElement('select');
  sel.id = 'crew';
  const ph = document.createElement('option');
  ph.value = ''; ph.textContent = '— оберіть екіпаж —';
  ph.disabled = true; 
  if (!getSavedCrew()) ph.selected = true;
  sel.appendChild(ph);
  
  crews.forEach(num => {
    const o = document.createElement('option');
    o.value = o.textContent = String(num);
    sel.appendChild(o);
  });
  
  wrap.innerHTML = '';
  wrap.appendChild(sel);
  
  const savedCrew = getSavedCrew();
  if (savedCrew && crews.includes(savedCrew)) {
    sel.value = savedCrew;
  }
  
  sel.addEventListener('change', function() {
    if (this.value) {
      saveSelectedCrew(this.value);
    }
  });
  
  document.getElementById('btnSend').disabled = false;
}

// ── Відсутні ──────────────────────────────────────────
function renderMissing(list) {
  const el = document.getElementById('missingList');
  if (!list) {
    el.innerHTML = '<div class="msg muted">⚠ Не вдалось отримати дані.<br>Перевірте SCRIPT_URL.</div>';
    return;
  }
  if (list.length === 0) {
    el.innerHTML = '<div class="msg ok">✓ Всі екіпажі надали відомості</div>';
    return;
  }
  el.innerHTML = '<div class="missing-grid">'
    + list.map(n => `<div class="missing-chip">${n}</div>`).join('')
    + '</div>';
}

// ── Завантажити з таблиці ─────────────────────────────
async function loadData() {
  const btn = document.getElementById('btnRefresh');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '↻ ...';
  }
  document.getElementById('missingList').innerHTML = '<div class="msg warn">⏳ завантаження...</div>';

  try {
    const date = isoToUa(document.getElementById('date').value) || todayUa();
    const res  = await fetch(`${SCRIPT_URL}?action=init&date=${encodeURIComponent(date)}&apiKey=${API_KEY}`, { cache: 'no-store' });
    const data = await res.json();

    if (data.crews && !document.getElementById('crew')) {
      renderCrewSelect(data.crews);
    } else if (data.crews && document.getElementById('crew')) {
      currentCrewList = data.crews;
      const currentSelect = document.getElementById('crew');
      const currentValue = currentSelect.value;
      const ph = currentSelect.querySelector('option[value=""]');
      currentSelect.innerHTML = '';
      currentSelect.appendChild(ph);
      data.crews.forEach(num => {
        const o = document.createElement('option');
        o.value = o.textContent = String(num);
        currentSelect.appendChild(o);
      });
      if (currentValue && data.crews.includes(currentValue)) {
        currentSelect.value = currentValue;
      } else {
        const saved = getSavedCrew();
        if (saved && data.crews.includes(saved)) {
          currentSelect.value = saved;
        }
      }
    }
    renderMissing(data.missing ?? null);
  } catch(e) {
    console.error(e);
    renderMissing(null);
    if (!document.getElementById('crew')) {
      document.getElementById('crewWrap').innerHTML =
        '<div class="skel" style="color:var(--danger)">⚠ помилка з\'єднання</div>';
    }
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = '↻ ОНОВИТИ';
    }
  }
}

// ── Відправити ────────────────────────────────────────
async function sendData() {
  const crewEl  = document.getElementById('crew');
  const dateVal = document.getElementById('date').value;

  if (!crewEl || !crewEl.value) { showSend('err','⚠ Оберіть екіпаж'); return; }
  if (!dateVal)                  { showSend('err','⚠ Вкажіть дату');   return; }

  const payload = {
    apiKey: API_KEY,
    action: 'submit',
    date:   isoToUa(dateVal),
    crew:   crewEl.value,
    mdz:    getInputValue('mdz'),
    bzt:    getInputValue('bzt'),
    b32:    getInputValue('b32'),
    ps:     getInputValue('ps'),
    tz:     getInputValue('tz'),
  };

  document.getElementById('btnSend').disabled = true;
  showSend('loading','⏳ Відправляємо...');

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    showSend('ok', `✓ Записано: екіпаж ${payload.crew} · ${payload.date}`);
    AMMO_ALL.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    recalc();
    setTimeout(loadData, 1800);
  } catch(e) {
    console.error(e);
    showSend('err','✗ Помилка зʼєднання. Перевірте URL скрипту.');
  } finally {
    document.getElementById('btnSend').disabled = false;
  }
}

function showSend(type, msg) {
  const el = document.getElementById('sendStatus');
  el.className = 'send-status ' + type;
  el.textContent = msg;
}

// ── Годинник ──────────────────────────────────────────
function tick() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
tick(); setInterval(tick, 30000);

// ── Оновлення при зміні дати ──────────────────────────
const dateInput = document.getElementById('date');
if (dateInput) {
  dateInput.addEventListener('change', () => {
    document.getElementById('missingList').innerHTML = '<div class="msg warn">⏳ завантаження...</div>';
    loadData();
  });
}

// ── Init ──────────────────────────────────────────────
if (dateInput) dateInput.value = todayISO();
setupAutoClearOnFocus();
recalc();
loadData();
setInterval(loadData, 120000);
</script>
</body>
</html>
